server.port=${SERVER_PORT:5002}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:test}
spring.datasource.username=${DB_USER:test}
spring.datasource.password=${DB_PASSWORD:test}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:test}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:test}